version: 2.1
executors:
  machine-default:
    machine: true
    resource_class: cisco_sdwan/linux_ec2_test
    # environment:
    #   HTTPS_PROXY: "http://proxy.esl.cisco.com:80"
    #   NO_PROXY: "*.cisco.com"
jobs:
  vtest:
    executor: machine-default
    steps:
      - run:
          name: Clone vtest repository
          no_output_timeout: 3h
          command: |
            mkdir -p vtest
            git clone git@sdwan-git.cisco.com:sdwan/vtest.git vtest
      - run:
          name: vtest test suite
          no_output_timeout: 3h
          command: |
            cd vtest
            source /scratch/jenkins/venvs/py38_vtest/bin/activate
            bin/runner vexpress -et rest -et test_scp_traffic -tt -b next -a STABLE -n tb -o -c -x --tls -y viptela_kvm -n CAT -dvn -edvn stcvm -o -x -c -ns -b next
  test:
    executor: machine-default
    steps:
      - run:
          name: Run tests
          command: echo "Hello. I am running as ${USER}"
  deploy:
    executor: machine-default
    steps:
      # Replace this with steps to deploy to users
      - run:
          name: deploy
          command: echo "Hello!"
workflows:
  example:
    jobs:
      - test
      - vtest:
          requires:
            - test
      - deploy:
          requires:
            - test
